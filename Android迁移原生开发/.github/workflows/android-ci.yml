name: Android Native CI
on:
  push:
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android迁移原生开发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eivra-native-debug-apk
          path: Android迁移原生开发/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
