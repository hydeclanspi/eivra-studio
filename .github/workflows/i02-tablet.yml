name: I02 tablet evidence
on:
  push:
    branches: [qa-i02-tablet]
    paths: ['.github/workflows/i02-tablet.yml']
permissions: {contents: read, actions: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 44410314187
          github-token: ${{ github.token }}
          name: eivra-v2-c5d4d1bb4f69abaf6e2794ca65652af06732ac87
          path: built
      - name: Check artifact and write read-only evidence driver
        run: |
          apk=$(find built -name app-debug.apk); cp "$apk" /tmp/eivra.apk
          echo '39aa713b620252ddd146248786059dc24924d9c3cdba601be9d6521a442b3c2a  /tmp/eivra.apk' | sha256sum -c -
          sudo chmod 666 /dev/kvm
          mkdir evidence
          cat > /tmp/eivra-tablet.py <<'PY'
          import subprocess as sp, re, time, pathlib, xml.etree.ElementTree as ET, struct
          out=pathlib.Path('evidence'); pkg='com.eivra.studio.v2'
          def adb(*args): return sp.check_output(['adb',*args],timeout=30)
          def dom():
              adb('shell','uiautomator','dump','/sdcard/studio.xml');return ET.fromstring(adb('exec-out','cat','/sdcard/studio.xml'))
          def nodes(t):return [e for e in t.iter('node') if e.get('package')==pkg]
          def txt(e):return (e.get('text','')+' '+e.get('content-desc','')).strip()
          def wait(needle):
              for i in range(8):
                  t=dom()
                  if any(needle in txt(e) for e in nodes(t)):return t
                  time.sleep(.2)
              raise RuntimeError('missing '+needle)
          def shot(n,t):
              b=adb('exec-out','screencap','-p'); assert struct.unpack('>II',b[16:24])==(1280,800); (out/(n+'-native.png')).write_bytes(b);(out/(n+'-window.xml')).write_bytes(ET.tostring(t,encoding='utf-8'))
          adb('shell','wm','size','1280x800');adb('shell','wm','density','160');adb('shell','settings','put','system','font_scale','1');adb('install','-r','/tmp/eivra.apk');adb('shell','wm','dismiss-keyguard');adb('shell','am','start','-W','-n',pkg+'/.MainActivity');t=wait('Quick Input');time.sleep(.45);shot('new',t)
          adb('shell','input','swipe','520','700','520','390','550'); time.sleep(.7);t=dom();shot('new-controls',t)
          p=next(e for e in nodes(t) if txt(e)=='Portfolio');x,y,x2,y2=map(int,re.findall(r'\d+',p.get('bounds')));adb('shell','input','tap',str((x+x2)//2),str((y+y2)//2));t=wait('已选');
          for i in range(10):
              if any('7' in txt(e) and ('已选' in txt(e) or '/' in txt(e)) for e in nodes(t)):break
              t=dom()
          shot('combo-loaded',t); assert not any('Unregistered operation' in txt(e) for e in nodes(t));assert any('7' in txt(e) and ('已选' in txt(e) or '/' in txt(e)) for e in nodes(t)), 'candidate count not verified'
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python /tmp/eivra-tablet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: I02-1280x800-exact-c5d4d1b
          path: evidence/
          retention-days: 7
          if-no-files-found: error
