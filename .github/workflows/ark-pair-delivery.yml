name: Build and verify the Compose + Ark package pair
on:
  push:
    branches: ['ci/compose-ark-pair-v41']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, compare signing certificates and verify the APK icon bytes
        run: bash .github/ark-pair/build.sh
      - uses: actions/upload-artifact@v4
        with: {name: verified-pair, path: paired/, if-no-files-found: error, retention-days: 7}
  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: verified-pair, path: paired}
      - run: sudo chmod 666 /dev/kvm
      - name: Install next to or over the previous APK; keep its sentinel; launch from its resolved entry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-build: 12414864
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/ark-pair/device.sh
  stage:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: delivery/compose-ark-pair-v41}
      - uses: actions/download-artifact@v4
        with: {name: verified-pair, path: paired}
      - name: Add only the verified APK, checksums and installation note to the clean delivery branch
        shell: bash
        run: |
          set -euo pipefail
          SRC=d8ea39267701af63e4276472425b07e938898006
          test "$(git rev-parse HEAD)" = "$SRC"
          test "$(git rev-parse HEAD:compose-and-ark-native/archive/v1)" = b35f09aea4178f9891d9051fb8d39306d89b4d58
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/ark-pair/stage.py" > "$RUNNER_TEMP/stage.py"
          python3 "$RUNNER_TEMP/stage.py"
          n=compose-and-ark-native
          git add -- "$n/Eivra-Studio-v4.1-Ark-icon.apk" "$n/README.md" "$n/SHA256SUMS"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          (cd "$n" && sha256sum -c SHA256SUMS)
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish the verified Android APK beside the original HarmonyOS HAP'
          git push origin HEAD:refs/heads/delivery/compose-ark-pair-v41
