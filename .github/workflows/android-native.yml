name: Android Native CI

on:
  push:
    branches: [android-native, main]
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Android迁移原生开发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install required Android SDK components
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Web regression baseline
        working-directory: eivra-studio
        run: npm ci && npm run lint && npm test && npm run build
      - name: Native engine packaging and golden tests
        working-directory: Android迁移原生开发/engine
        run: npm install && npm run test && npm run build
      - name: Unit tests and native boundary checks
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble native APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Native UI smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: cd Android迁移原生开发 && ./gradlew connectedDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eivra-native-debug-apk
          path: Android迁移原生开发/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
