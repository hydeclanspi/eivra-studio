name: Android Native CI

on:
  push:
    branches: [android-native, main]
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android迁移原生开发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests and native boundary checks
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble native APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eivra-native-debug-apk
          path: Android迁移原生开发/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
