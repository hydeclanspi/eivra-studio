name: Android Native CI

on:
  push:
    branches: [android-native, main]
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["Android迁移原生开发/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Android迁移原生开发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install required Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-commandline.zip
            sudo python3 -c "import zipfile;zipfile.ZipFile('/tmp/android-commandline.zip').extractall('$ANDROID_HOME/cmdline-tools/latest')"
            sudo chmod -R a+rx "$ANDROID_HOME/cmdline-tools/latest/bin"
            sudo chown -R "$USER:$USER" "$ANDROID_HOME"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Web regression baseline
        working-directory: eivra-studio
        run: npm ci && npm run lint && npm test && npm run build
      - name: Native engine packaging and golden tests
        working-directory: Android迁移原生开发/engine
        run: npm install && npm run test && npm run build
      - name: Unit tests and native boundary checks
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble native APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Enable KVM for native emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            sudo usermod -aG kvm "$USER" || true
          fi
          ls -l /dev/kvm || true
      - name: Native UI smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            cd "$GITHUB_WORKSPACE"
            chmod +x Android迁移原生开发/gradlew
            set +e
            ./Android迁移原生开发/gradlew -p Android迁移原生开发 connectedDebugAndroidTest
            TEST_STATUS=$?
            set -e
            bash Android迁移原生开发/scripts/capture-native-workspaces.sh
            exit $TEST_STATUS
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eivra-native-emulator-evidence
          path: |
            Android迁移原生开发/app/build/outputs/androidTest-results/
            Android迁移原生开发/app/build/reports/androidTests/
            Android迁移原生开发/app/build/outputs/apk/androidTest/
            Android迁移原生开发/app/build/outputs/native-screenshots/
          retention-days: 30
      - name: Verify APK and test reports
        if: always()
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/reports -type f | sort
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eivra-native-debug-apk
          path: Android迁移原生开发/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
