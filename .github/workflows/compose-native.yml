name: Compose Native v4.1
on:
  push:
    branches: [android-native, main]
    paths: ['compose-and-ark-native/v4/**', '.github/workflows/compose-native.yml']
  pull_request:
    branches: [android-native, main]
    paths: ['compose-and-ark-native/v4/**', '.github/workflows/compose-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compose-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    defaults:
      run:
        working-directory: compose-and-ark-native/v4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep the archive byte-identical
        run: test "$(git rev-parse HEAD:compose-and-ark-native/archive/v1)" = b35f09aea4178f9891d9051fb8d39306d89b4d58
      - name: Prepare offline kernel if present
        run: if test -f lanes/platform/prepare.sh; then bash lanes/platform/prepare.sh; fi
      - name: Verify the packaged offline engine against a synthetic ledger
        run: |
          if test -f tools/kernel-journey.cjs && test -f lanes/platform/assets/platform-kernel.js; then
            node tools/kernel-journey.cjs
            node tools/v4-ranked-parity.cjs
          fi
      - name: Compile app and instrumented tests, run JVM tests
        run: bash gradlew --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: eivra-v41-${{ github.sha }}
          path: |
            compose-and-ark-native/v4/app/build/outputs/apk/debug/*.apk
            compose-and-ark-native/v4/app/build/test-results/testDebugUnitTest/
          retention-days: 7
      - name: Preserve failing compiler or JVM diagnostics without publishing private data
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v4-test-reports-${{ github.sha }}
          path: compose-and-ark-native/v4/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Share the exact tested application and instrumentation APKs with device jobs
        if: github.ref == 'refs/heads/android-native'
        uses: actions/upload-artifact@v4
        with:
          name: instrument-pair-${{ github.sha }}
          path: |
            compose-and-ark-native/v4/app/build/outputs/apk/debug/app-debug.apk
            compose-and-ark-native/v4/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3
  device:
    needs: build
    if: github.ref == 'refs/heads/android-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        viewport: [390x844, 1280x800]
        gate: [features, regression]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: instrument-pair-${{ github.sha }}
          path: compose-and-ark-native/v4/app/build/outputs/apk/
      - name: Verify inputs and prepare host
        run: |
          test -s compose-and-ark-native/v4/app/build/outputs/apk/debug/app-debug.apk
          test -s compose-and-ark-native/v4/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          python3 -c 'from PIL import Image' || python3 -m pip install Pillow
          sudo chmod 666 /dev/kvm
          free -h; df -h /; sha256sum compose-and-ark-native/v4/app/build/outputs/apk/debug/app-debug.apk
      - name: Native interactions and motion capture
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 22
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          ram-size: 2048M
          heap-size: 384M
          cores: 2
          disable-animations: true
          script: bash compose-and-ark-native/v4/check-shell.sh ${{ matrix.viewport }} ${{ matrix.gate }}
      - name: Preserve each viewport independently, including failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-${{ matrix.viewport }}-${{ matrix.gate }}-${{ github.sha }}
          path: compose-and-ark-native/v4/app/build/shell-evidence/
          if-no-files-found: warn
          retention-days: 7
  reference:
    if: github.ref == 'refs/heads/android-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect fresh public Web references, independently of Android results
        working-directory: compose-and-ark-native/v4
        run: |
          python tools/ci-fonts.py
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python tools/capture_web.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reference-${{ github.sha }}
          path: compose-and-ark-native/v4/app/build/web-reference/
          retention-days: 7
          if-no-files-found: error
